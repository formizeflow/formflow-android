name: Release
on:
  push: { tags: ["v*"] }
permissions: { contents: read }
jobs:
  release:
    runs-on: ubuntu-latest
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Tag matches library version
        run: grep -q "version = \"${GITHUB_REF_NAME#v}\"" formflow/build.gradle.kts
      - run: ./gradlew --no-daemon :formflow:testDebugUnitTest :formflow:assembleRelease
      - run: cp formflow/build/outputs/aar/formflow-release.aar "formflow-android-${GITHUB_REF_NAME#v}.aar"
      - name: Source archive
        run: git archive --format=tar.gz --prefix="${{ github.event.repository.name }}-${GITHUB_REF_NAME}/" -o "${{ github.event.repository.name }}-${GITHUB_REF_NAME}.tar.gz" HEAD
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            *.aar
            *.tar.gz
      - name: GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" *.aar *.tar.gz --generate-notes --verify-tag
